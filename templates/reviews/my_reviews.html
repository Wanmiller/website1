{% extends 'base.html' %}
{% block title %}My Reviews | CineVerse{% endblock %}
{% block content %}
<div class="cv-section">
  <header class="style1"><h2>My Reviews</h2></header>
  {% for review in reviews %}
    <div class="box">
      <h3>{{ review.movie.title }}</h3>
      <p>{{ review.title }}</p>
      <p>{{ review.rating }}/5</p>
    </div>
  {% empty %}
    <p>No reviews.</p>
  {% endfor %}
</div>
{% endblock %}
