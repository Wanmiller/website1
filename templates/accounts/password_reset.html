{% extends 'base.html' %}
{% block title %}Password Reset | CineVerse{% endblock %}
{% block content %}
<div class="cv-section">
  <header class="style1"><h2>Reset Password</h2></header>
  <form method="post">
    {% csrf_token %}
    <div class="row gtr-50">{% include 'includes/form_fields.html' with form=form %}</div>
    <ul class="actions"><li><button class="button style1" type="submit">Send</button></li></ul>
  </form>
</div>
{% endblock %}
