{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Login" %} | PersonaVerse{% endblock %}
{% block content %}
<div class="pv-nx-page">
  <section class="cv-section box feature2">
    <header class="style1"><h2>{% trans "Login" %}</h2></header>
    <form method="post" data-submit-lock data-client-validate>
      {% csrf_token %}
      <div class="row gtr-50">{% include 'includes/form_fields.html' with form=form %}</div>
      <ul class="actions">
        <li><button class="button style1" type="submit" data-loading-text="{% trans 'Logging in...' %}">{% trans "Login" %}</button></li>
        <li><a class="button style2" href="{% url 'accounts:password_reset' %}">{% trans "Forgot Password" %}</a></li>
      </ul>
    </form>
  </section>
</div>
{% endblock %}
