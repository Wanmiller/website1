{% extends 'base.html' %}
{% block title %}Genres | CineVerse{% endblock %}
{% block content %}
<div class="cv-section">
  <header class="style1"><h2>Genres</h2></header>
  <div class="cv-grid">
    {% for genre in genres %}
      <a class="button style2" href="{% url 'genres:detail' genre.slug %}">{{ genre.name }}</a>
    {% empty %}
      <p>No genres.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
