{% extends 'base.html' %}
{% block title %}{{ genre.name }} | Genres{% endblock %}
{% block content %}
<section><div class="inner"><header class="major"><h1>{{ genre.name }}</h1></header><p>{{ genre.description }}</p><ul>{% for movie in genre.movies.all %}<li><a href="{% url 'movies:detail' movie.slug %}">{{ movie.title }}</a></li>{% empty %}<li>No movies in this genre.</li>{% endfor %}</ul></div></section>
{% endblock %}
