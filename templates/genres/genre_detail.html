{% extends 'base.html' %}
{% block title %}{{ genre.name }} | Genres{% endblock %}
{% block content %}
<div class="cv-section">
  <header class="style1"><h2>{{ genre.name }}</h2></header>
  <p>{{ genre.description }}</p>
  <ul>
    {% for movie in genre.movies.all %}
      <li><a href="{% url 'movies:detail' movie.slug %}">{{ movie.title }}</a></li>
    {% empty %}
      <li>No movies in this genre.</li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
