{% if page_obj.has_other_pages %}
<section>
  <div class="inner">
    <ul class="pagination">
      {% if page_obj.has_previous %}
        <li><a href="?page={{ page_obj.previous_page_number }}&q={{ filters.q }}&genre={{ filters.genre }}&year={{ filters.year }}&ordering={{ filters.ordering }}" class="button small">Prev</a></li>
      {% endif %}
      <li><span class="page-meta">Page {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
      {% if page_obj.has_next %}
        <li><a href="?page={{ page_obj.next_page_number }}&q={{ filters.q }}&genre={{ filters.genre }}&year={{ filters.year }}&ordering={{ filters.ordering }}" class="button small">Next</a></li>
      {% endif %}
    </ul>
  </div>
</section>
{% endif %}
