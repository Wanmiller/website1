{% if page_obj.has_other_pages %}
<div class="cv-section">
  <ul class="pagination">
    {% if page_obj.has_previous %}
      <li><a href="?page={{ page_obj.previous_page_number }}&q={{ filters.q }}&genre={{ filters.genre }}&year={{ filters.year }}&ordering={{ filters.ordering }}" class="button style2 small">Prev</a></li>
    {% endif %}
    <li><span class="page-meta">Page {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}
      <li><a href="?page={{ page_obj.next_page_number }}&q={{ filters.q }}&genre={{ filters.genre }}&year={{ filters.year }}&ordering={{ filters.ordering }}" class="button style2 small">Next</a></li>
    {% endif %}
  </ul>
</div>
{% endif %}
