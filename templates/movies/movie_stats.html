{% extends 'base.html' %}
{% block title %}Stats | CineVerse{% endblock %}
{% block content %}
<div class="cv-section">
  <header class="style1"><h2>Genre Statistics</h2></header>
  <ul>
    {% for item in stats %}
      <li>{{ item.genres__name|default:'No Genre' }}: {{ item.total }}</li>
    {% empty %}
      <li>No stats yet</li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
